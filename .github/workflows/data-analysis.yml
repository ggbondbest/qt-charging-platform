name: Data analysis checks

on:
  push:
    branches: [develop, master]
    paths: ['data_analysis/**', '.github/workflows/data-analysis.yml']
  pull_request:
    paths: ['data_analysis/**', '.github/workflows/data-analysis.yml']

permissions:
  contents: read

jobs:
  generator:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Generator and integrity regression tests
        run: python -m unittest data_analysis.tests.test_generator -v
      - name: Validate committed sample data
        run: python -m data_analysis.charging_data.validate --dataset data_analysis/datasets/charging_sample_7d_v1

  spark:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r data_analysis/requirements-spark.txt
      - name: Real Spark cleaning and statistics tests
        env:
          RUN_SPARK_TESTS: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: python -m unittest data_analysis.tests.test_spark_pipeline -v
