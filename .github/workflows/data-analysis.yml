name: Data analysis checks

on:
  push:
    branches: [develop, master]
  pull_request:

# Every PR must report all required checks. Workflow-level path filters would
# leave documentation-only PRs permanently waiting for branch protection.
concurrency:
  group: data-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-static:
    name: Python static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.13.2
      - name: Check Python syntax and undefined names, including ML and advisor
        # Fatal/error checks only: do not impose a new formatting policy on the
        # existing research modules. Recursive ML coverage includes new modules.
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          data_analysis/ml data_analysis/delivery data_analysis/chargepilot
          data_analysis/backend data_analysis/spark_jobs data_analysis/contracts data_analysis/tests

  generator:
    name: generator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install IANA time-zone data on Windows
        if: matrix.os == 'windows-latest'
        # Windows has no system IANA database for zoneinfo; this is not a
        # Spark/ML dependency and must not make timezone tests silently skip.
        run: python -m pip install tzdata==2025.2
      - name: Portable regressions and committed advanced/cleaning evidence
        # Stdlib discovery includes test_advanced_bundle and ChallengePlanTests.
        # Optional API/ML/Spark cases run with their real dependencies below.
        run: python -m unittest discover -s data_analysis/tests -v
      - name: Validate committed sample data
        run: python -m data_analysis.charging_data.validate --dataset data_analysis/datasets/charging_sample_7d_v2
      - name: Validate committed full cleaning handoff
        run: python -m data_analysis.publishing.acceptance_bundle --verify data_analysis/datasets/analytics_full_180d_v1

  api:
    name: API and contracts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    services:
      mysql:
        # An empty image disables the service on Windows. Real MySQL is tested
        # on Linux; Windows still runs the portable API/contract regressions.
        image: ${{ matrix.os == 'ubuntu-22.04' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            data_analysis/requirements-api.txt
            data_analysis/requirements-contract-test.txt
      - name: Install API and HTTP test dependencies (no Spark)
        run: python -m pip install -r data_analysis/requirements-api.txt -r data_analysis/requirements-contract-test.txt
      - name: Read-only API, publication integrity and public contracts
        run: >-
          python -m unittest
          data_analysis.tests.test_analytics_api
          data_analysis.tests.test_advanced_api
          data_analysis.tests.test_advanced_store
          data_analysis.tests.test_publishing
          data_analysis.tests.test_bundle
          data_analysis.tests.test_contracts
          data_analysis.tests.test_json_schemas
          data_analysis.tests.test_contract_drift -v
      - name: Real MySQL 8.4 publication, API and verification
        if: matrix.os == 'ubuntu-22.04'
        env:
          RUN_MYSQL_TESTS: '1'
          MYSQL_TEST_HOST: '127.0.0.1'
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: ci-only-password
        run: >-
          python -m unittest
          data_analysis.tests.test_mysql_publishing
          data_analysis.tests.test_mysql_api
          data_analysis.tests.test_mysql_verification -v

  spark:
    name: Spark / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cleaning
            module: data_analysis.tests.test_spark_pipeline data_analysis.tests.test_cleaning_quality
          - suite: dirty-parser
            module: data_analysis.tests.test_dirty_injection.SparkDirtyParsingTests data_analysis.tests.test_cleaning_challenge
          - suite: dashboard
            module: data_analysis.tests.test_dashboard_aggregates
          - suite: ml-features
            module: data_analysis.tests.test_ml_features
          - suite: data-export
            module: data_analysis.tests.test_data_export data_analysis.tests.test_acceptance_analysis data_analysis.tests.test_advanced_analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data_analysis/requirements-spark.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r data_analysis/requirements-spark.txt
      - name: Real Spark integration tests
        env:
          RUN_SPARK_TESTS: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: python -m unittest ${{ matrix.module }} -v

  chargepilot:
    name: Integrated delivery / ML and MySQL
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      # Online protocol/error handling is exercised with an injected transport;
      # CI never requires a real provider, API key or paid request.
      ML_ADVISOR_ONLINE_ENABLED: '0'
      ML_ADVISOR_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            data_analysis/requirements-api.txt
            data_analysis/requirements-chargepilot.txt
            data_analysis/requirements-delivery.txt
      - run: python -m pip install -r data_analysis/requirements-delivery.txt
      - name: Train all real CPU models from committed CLEAN data, not optional skipped model tests
        run: python -m data_analysis.delivery.cli train
      - name: Integrated analytics, forecast, insights, real HTTP and concurrent MySQL state machine
        env:
          RUN_MYSQL_TESTS: '1'
          MYSQL_TEST_HOST: '127.0.0.1'
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: ci-only-password
        run: >-
          python -m unittest
          data_analysis.tests.test_chargepilot_ml
          data_analysis.tests.test_chargepilot_store
          data_analysis.tests.test_chargepilot_integration
          data_analysis.tests.test_chargepilot_experiment
          data_analysis.tests.test_ml_load_review_fixes
          data_analysis.tests.test_availability_adapter
          data_analysis.tests.test_ml_anomaly_churn
          data_analysis.tests.test_ml_insights_delivery
          data_analysis.tests.test_delivery_forecasts
          data_analysis.tests.test_delivery_contracts
          data_analysis.tests.test_delivery_integration
          data_analysis.ml.tests.test_delivery_safety -v
      - name: Advisor RAG retrieval, generation boundary and same-origin HTTP
        run: |
          python -c "from data_analysis.tests.test_delivery_advisor import HAS_DEPS; assert HAS_DEPS, 'Advisor HTTP tests must run with complete delivery dependencies'"
          python -m unittest data_analysis.tests.test_ml_advisor data_analysis.tests.test_advisor_analysis data_analysis.tests.test_advisor_knowledge data_analysis.tests.test_advisor_output data_analysis.tests.test_advisor_rag data_analysis.tests.test_delivery_advisor -v
      - name: Calculate bounded paired simulation (no hard-coded improvement)
        run: python -m data_analysis.chargepilot.cli experiment --users 100 --seed 42

  chargepilot-web:
    name: Integrated delivery / Vue
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data_analysis/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: data_analysis/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
