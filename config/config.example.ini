; Copy to config.ini for local development. config.ini is ignored by Git.

[network]
host=127.0.0.1
port=9527

[database]
; Empty means the Server will use QStandardPaths::AppDataLocation.
path=
seed_demo_data=false

[map]
; Put map credentials in config/services.local.json under tencentMap.
; The client reads that JSON automatically; this legacy INI field is documentation only.
; TENCENT_MAP_API_KEY remains an optional environment override.
tencent_api_key=
