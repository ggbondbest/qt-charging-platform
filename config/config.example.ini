; Copy to config.ini for local development. config.ini is ignored by Git.

[network]
host=127.0.0.1
port=9527

[database]
; Empty means the Server will use QStandardPaths::AppDataLocation.
path=
seed_demo_data=false

[map]
; The runtime reads TENCENT_MAP_API_KEY (CHARGING_TENCENT_MAP_KEY is a legacy alias).
; This file documents configuration only; export the environment variable before launch.
tencent_api_key=
