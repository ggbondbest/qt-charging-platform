<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no">
<title>腾讯地图</title>
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://map.qq.com/api/js?v=2.exp&key=%TENCENT_MAP_KEY%"></script>
<script>
  var center = new qq.maps.LatLng(%CENTER_LAT%, %CENTER_LNG%);
  var map = new qq.maps.Map(document.getElementById('map'), {
    center: center,
    zoom: 13,
    draggable: true,
    zoomControl: true,
    mapTypeControl: false
  });

  // 当前位置标记。
  new qq.maps.Marker({ position: center, map: map, title: '当前位置' });

  // 附近电站标记：[[lat, lng, 站名], ...] 由客户端注入。
  var stations = %STATION_POINTS%;
  for (var i = 0; i < stations.length; ++i) {
    new qq.maps.Marker({
      position: new qq.maps.LatLng(stations[i][0], stations[i][1]),
      map: map,
      title: stations[i][2]
    });
  }

  // 导航路线折线：[[lat, lng], ...] 由客户端注入；空数组 = 首页口径不画线。
  var route = %ROUTE_POINTS%;
  if (route.length > 1) {
    var path = route.map(function (p) { return new qq.maps.LatLng(p[0], p[1]); });
    new qq.maps.Polyline({
      map: map,
      path: path,
      strokeColor: '#00B578',
      strokeWeight: 6,
      strokeOpacity: 0.9
    });
    // 视野自动包住整条路线（含起终点）。
    var bounds = new qq.maps.LatLngBounds();
    for (var j = 0; j < path.length; ++j) { bounds.extend(path[j]); }
    map.fitBounds(bounds);
  }
</script>
</body>
</html>
